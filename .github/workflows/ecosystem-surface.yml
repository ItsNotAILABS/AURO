name: Ecosystem and Corpus Surface

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install pytest
      - name: Compile protocol helpers
        run: python -m py_compile tools/validate_ecosystem_surface.py tools/corpus_runtime.py
      - name: Validate ecosystem capability surface
        run: python tools/validate_ecosystem_surface.py
      - name: Validate Corpus architecture binding
        run: python tools/corpus_runtime.py | tee auro-corpus-validation.json
      - name: Run focused Corpus tests
        run: python -m pytest -q tests/test_corpus_architecture.py
      - uses: actions/upload-artifact@v4
        with:
          name: auro-corpus-validation
          path: auro-corpus-validation.json
          if-no-files-found: error
